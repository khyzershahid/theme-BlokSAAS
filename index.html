<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BLOK — one sharp workspace for planning, building and shipping. Frontend-only landing page." />
    <meta name="theme-color" content="#f4f1ea" />
    <script>
      // Apply the stored theme before first paint so there is no flash.
      ;(function () {
        var t = null
        try {
          t = localStorage.getItem('blok-theme')
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        }
        document.documentElement.setAttribute('data-theme', t)
        document.documentElement.style.colorScheme = t
        var m = document.querySelector('meta[name="theme-color"]')
        if (m) m.setAttribute('content', t === 'dark' ? '#0d0d12' : '#f4f1ea')
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f4f1ea'/%3E%3Crect x='3' y='3' width='12' height='12' fill='%23101014'/%3E%3Crect x='17' y='3' width='12' height='12' fill='%23ff5a1f'/%3E%3Crect x='3' y='17' width='12' height='12' fill='%234f6bff'/%3E%3Crect x='17' y='17' width='12' height='12' fill='%23101014'/%3E%3C/svg%3E"
    />
    <title>BLOK — All your work. One clean block.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
